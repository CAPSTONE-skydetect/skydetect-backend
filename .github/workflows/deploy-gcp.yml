name: Deploy to GCP
# main 에 push 되면 테스트 후 백엔드 이미지를 Artifact Registry 에 올린다.
# 앱 VM 의 autodeploy 타이머가 1분 안에 새 backend:main 이미지를 받아 백엔드만 다시 띄운다.
# 배포 구성은 skydetect-ai 저장소 docker/gcp/README.md 참고.
# GCP 인증은 Workload Identity Federation 이라 GitHub 에 키 파일을 두지 않는다
# (GCP 쪽에서 CAPSTONE-skydetect 조직의 refs/heads/main 실행만 허용).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-gcp-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: asia-northeast3-docker.pkg.dev
  IMAGE: asia-northeast3-docker.pkg.dev/skydetect-514809/skydetect/backend
  WIF_PROVIDER: projects/375497460357/locations/global/workloadIdentityPools/github/providers/github
  DEPLOY_SA: github-deployer@skydetect-514809.iam.gserviceaccount.com

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # 통합 테스트(@SpringBootTest)가 실제 MySQL 에 붙는다. CI 전용 임시 DB.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: skydetect
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uci -pci-password --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/skydetect?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ci
      SPRING_DATASOURCE_PASSWORD: ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: chmod +x gradlew && ./gradlew test --no-daemon

  push:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
          token_format: access_token
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Build and push backend image
        run: |
          docker build -t "$IMAGE:main" -t "$IMAGE:${GITHUB_SHA::7}" .
          docker push --all-tags "$IMAGE"
